<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>ExGb Lobby</title>
    <link rel="stylesheet" href="static/styles/index.css?v=9.0" />
    <script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
   

</head>
<body>
    <div class="content">
        <h1 class="title">
            <span>E</span><span>x</span><span>G</span><span>B</span>
        </h1>
        

        <div class="menu-cont">
            <div class="menu-controls">
                <div class="menu-control" data-mode="home"> HOME</div>
                <div class="menu-control" data-mode="play"> PLAY </div>
                <div class="menu-control"> GEAR </div>
                <div class="menu-control" data-mode="link"> LINK </div>
            </div>

            <div class="menu">

                <div class="play" style="display: none;">
                    <h1 class="retro-title">
                        PLAY
                    </h1>
                    <div class="play-content">
                        <span class="play-content-text">AVAILABLE SERVERS: <span id="serverCount">0</span></span>
                        <button id="playButton" class="play-button">REQUEST GAMEBOY</button>
                    </div>
                </div>
                <div class="rom-selection" style="display: none;">
                    <h1 class="retro-title">
                        SELECT A ROM
                    </h1>
                    <div class="roms-list">
                        <img src="static/images/roms/rom1.png" alt="ROM 1" class="rom-item" data-rom="sumar">
                        <img src="static/images/roms/rom2.png" alt="ROM 2" class="rom-item" data-rom="tetris">
                        <img src="static/images/roms/rom3.png" alt="ROM 3" class="rom-item" data-rom="rom3">
                        <img src="static/images/roms/rom1.png" alt="ROM 4" class="rom-item" data-rom="rom4">
                        <img src="static/images/roms/rom2.png" alt="ROM 5" class="rom-item" data-rom="rom5">
                        <img src="static/images/roms/rom3.png" alt="ROM 6" class="rom-item" data-rom="rom6">
                    </div>

                </div>

                <div class="link">
                    <h1 class="retro-title">
                        LINK
                    </h1>
                    <div class="link-content">
                        <span class="link-content-text">Spectate game</span>
                       <div class="link-input-wrap">
    <input class="link-input" type="text" id="serverInput" maxlength="5" pattern=".{5,}" required autocomplete="off" />
</div>
                        <button id="connectButton" class="link-button">CONNECT</button>
                    </div>  
                </div>



                <div class="game" style="display: none;">
                    <canvas id="gameCanvas" class="gameCanvas" width="320" height="288"></canvas>
                    <div class="game-ID">
                        <h1>Game ID: </h1>
                        <span id="gameId">0000</span>
                    </div>
                </div>

            </div>

            
        </div>
    </div>   
</body>
<script src="static/scripts/index.js?v=19"></script>
</html>
